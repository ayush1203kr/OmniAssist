[project]
name = "omniassist"
version = "1.0.0"
description = "OmniAssist — Autonomous Customer Support & Operations Assistant (LangChain agent + NLTK preprocessing + ChromaDB RAG + FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain>=0.3.27,<0.4",
    "langchain-core>=0.3.79,<0.4",
    "langchain-openai>=0.3.3,<0.4",
    "langchain-chroma>=0.2.6,<0.3",
    "langchain-text-splitters>=0.3.11,<0.4",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "nltk>=3.9",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "langchain-google-genai>=2.1.12",
]
